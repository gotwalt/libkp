[project]
# A development shell, not a distributable: the integration ships as the
# `custom_components/kemper` directory that build.py bundles, and Home
# Assistant loads it from a config directory rather than from a wheel. This
# file exists so `uv sync` can put Home Assistant's test harness on the path.
name = "kemper-homeassistant"
version = "0.1.0"
description = "Development environment for the Kemper Profiler Home Assistant integration."
requires-python = ">=3.14.2"
dependencies = [
    # Pins homeassistant==2026.8.3 and brings pytest + the custom-component fixtures.
    "pytest-homeassistant-custom-component==0.13.357",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for `custom_components.kemper`, ../../src for the top-level `libkp` that
# libkp's own test harness imports, ../../tests for that harness (fake_device).
pythonpath = [".", "../../src", "../../tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# The vendored library is linted by python/'s own configuration; dist/ is build
# output, and the symlink would otherwise be linted twice under two names.
extend-exclude = ["custom_components/kemper/libkp", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
