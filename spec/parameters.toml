# Parameter address maps for the Kemper Profiler.
#
# Provenance: transcribed from the official Kemper MIDI Parameter Documentation
# (page/number → name, effect types, string tags, SysEx functions), plus a few
# addresses credited to PySwitch: the Fixed-FX page (0x05), and the tuner /
# tempo / meter addresses on pages 0x7C / 0x7D / 0x7F. Meter-field identities
# (page 0x7C, numbers 78–88) and the morph addresses on page 0 were established
# by observed experimentation (see docs/07-realtime-status.md and docs/05).
#
# Addressing: a parameter is (page, number). Effect modules A..REV share one
# parameter map. Page 0 is dual-use: string tags via $03/$43, numeric params
# (the morph button and position) via $01.

# SysEx function code → short name (Kemper MIDI doc, Table 5).
functions = [
  { code = 0x01, name = "single-param" },
  { code = 0x02, name = "multi-param" },
  { code = 0x03, name = "string-param" },
  { code = 0x04, name = "blob" },
  { code = 0x06, name = "ext-param" },
  { code = 0x07, name = "ext-string-param" },
  { code = 0x08, name = "morphed-multi-param" },
  { code = 0x3C, name = "rendered-string-reply" },
  { code = 0x41, name = "request-single" },
  { code = 0x42, name = "request-multi" },
  { code = 0x43, name = "request-string" },
  { code = 0x47, name = "request-ext-string" },
  { code = 0x7C, name = "request-rendered-string" },
  { code = 0x7E, name = "beacon" },
]

# Address page (section) names.
pages = [
