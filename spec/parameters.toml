# Common effect-slot parameter numbers (within any effect page).
[effect_param_numbers]
type = 0     # effect Type (value → effect-types.toml)
state = 3    # On/Off (1 = on, 0 = off)
mix = 4      # dry/wet Mix (0–16383)
volume = 6   # Volume

# Well-known addresses referenced by the DeviceModel decode/sync logic. These
# name the constants each implementation's state layer keys on.
[well_known]
page_strings = 0x00
# The page-0 string tags the state tree stores (function $03 / $43, and the same
# numbers again as $07 extended strings on the rig-load dump).
string_rig_name = 0x01
string_rig_author = 0x02
string_rig_date = 0x03
string_rig_comment = 0x04
# Measured, not assumed: the amplifier's tags start at 0x10 (name, author,
# date, ... mirror the rig's 0x01..0x04 and the cabinet's 0x20..), and a
# request for tag 0x0A draws no reply at all. The old value here was a guess
# that nothing ever checked, because a fire-and-forget request cannot notice
# an answer that never comes.
string_amp_name = 0x10
string_cabinet_name = 0x20
page_realtime = 0x7C
meter_block_number = 0x4E     # first NRPN number of the 11-value status block
beat_pulse_number = 0x00
tuner_deviance_number = 0x0F
page_rig_settings = 0x04
tempo_number = 0x00
tempo_bpm_scale = 64          # wire value = bpm * 64
rig_volume_number = 0x01
amp_page = 0x0A
amp_on_number = 0x02
gain_number = 0x04
cabinet_page = 0x0C
cabinet_on_number = 0x02
system_page = 0x7F
main_volume_number = 0x00
headphone_volume_number = 0x01
monitor_volume_number = 0x02
# The physical Master Volume knob is a potentiometer (the only absolute-position
# control on the device) that drives Headphone (0x7F/1) and Monitor (0x7F/2) 1:1
# under the default output routing. It has no soft-takeover, so a written value
# is authoritative only until the pot next moves; treat master volume as a
# read-only readout. Main Output (0x7F/0) is independent of the knob.
# Morph lives on page 0 (dual-use with the string page). The button is a
# momentary the device reports on press and release; the position is the fader
# it drives, 0 = base .. 16383 = fully morphed.
#
# The position is **push-only and CBOR-only**: neither a $41 nor a $46 request
# draws any reply, and it never appears on the MIDI3 stream even while a morph
# is ramping. The CBOR state dump carries it, and a CBOR session sees it move.
# So a MIDI3 client learns *that* a morph happened, and hears what it did to the
# audio parameters, but never where the fader sits. See docs/05.
page_morph = 0x00
morph_number = 0x77
morph_button_number = 0x50
# The morph position as a single CBOR address (page_morph * 128 + morph_number),
# which is how the state dump names it.
morph_address = 119
page_tuner_note = 0x7D
tuner_note_number = 0x54
tuner_in_tune_center = 8192
tuner_in_tune_window = 350
meter_count = 11
# Bank Preview (page 0x96): the loaded bank's five-slot name preview. The three
# groups of five consecutive numbers start at these bases (rig / amp / cabinet).
page_bank_preview = 0x96
bank_slots = 5
bank_rig_name_base = 0x00
bank_amp_name_base = 0x05
bank_cabinet_name_base = 0x0A
# The device's current position, as single extended addresses. Both are 0-based:
# bank 0 slot 0 is the first rig of the first bank. They are readable on the
# streaming session with a `$46` request (reply `$06`), and the device pushes an
# unsolicited `$06` for whichever of the two changed on every rig change — from
# the front panel as readily as from a controller. They also appear in the CBOR
# state dump (docs/06), which is how a client learns them before a session opens.
current_bank_address = 100701      # 0x1895D
current_rig_slot_address = 100702  # 0x1895E
