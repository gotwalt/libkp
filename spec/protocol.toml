# Transport, discovery, handshake, and framing constants for the Kemper
# Profiler network protocol.
#
# Provenance: the transport envelope (ports, the DSCV discovery TagStream, the
# GUID handshake, the MIDI3 framing, and the session preamble) is documented
# from observed experimentation. The MIDI/SysEx manufacturer id and message
# grammar carried inside the envelope follow the official Kemper MIDI Parameter
# Documentation, cross-checked against PySwitch.

[transport]
# One port serves both UDP discovery and the TCP session (0x165f).
port = 5727
# TCP connect timeout and socket read timeout, in seconds.
connect_timeout_secs = 5
# How long to wait for the first byte of the greeting, and of the reply to a
# protocol selection, once the socket is up. Measured: normally under 30 ms,
# but a device that has served a few sessions has taken 800 ms — and the
# read idle that bounds the gap *between* chunks is far too short for that.
handshake_timeout_ms = 2000
socket_timeout_secs = 15
# Minimum quiet gap between one TCP session closing and the next one opening, in
# milliseconds. The device refuses to greet — or resets — a session opened too
# soon after a prior socket closed (observed live: a session opened immediately
# after a close times out waiting for the greeting; ~1 s of spacing connects
# cleanly). An orchestrator that opens more than one session — e.g. the CBOR
# state-dump snapshot followed by a MIDI3 stream — must space them by at least
# this, and never run them concurrently. See docs/06.
connection_cooldown_ms = 1000

[safety]
# Pacing the model applies on the device's behalf. Every value here is measured
# (docs/11): a SysEx request of any kind answers in under 50 ms even with the
# whole 46-request connect burst in flight, and the CBOR state dump lands in
# about 350 ms. The reconnect and reopen floors are the spacing MetersApp used
# for a year without wedging a device; nothing faster has been tried.
request_timeout_ms = 300          # a request unanswered this long is reported as timed out and never retried
max_in_flight_requests = 16       # requests on the wire at once; the rest queue
dump_settle_ms = 1000             # the dump phase ends this long after the trigger if the end marker never comes
reconnect_delay_ms = 4000         # first retry after the stream is lost, when a client opts into reconnecting
reconnect_max_delay_ms = 30000    # the retry delay doubles up to this
control_reopen_min_gap_ms = 30000 # the control channel is never reopened closer than this to its last open
rig_load_settle_ms = 500          # a rig load is in flight this long; the device pushes the landed rig on both wires within ~400 ms
pending_window_ms = 1500          # an aim the device has not confirmed this long after its move settled is dropped
rig_load_controllers = [48, 49, 50, 51, 52, 53, 54]   # CC numbers that load a rig (down, up, slot 1-5); CC47 bank preselect loads nothing

[discovery]
# UDP broadcast discovery. The client broadcasts a fixed 34-byte poll; Profilers
# on the LAN reply on the same port with a DSCV TagStream of key/value fields.
header = "DSCV"                       # 4-byte ASCII header, no length prefix
poll_interval_ms = 500
# The poll payload is: "DSCV" <len>"MAC#<mac>" <len>"POLL:)" 0x00, where each
# length byte is inclusive of itself. The MAC is the client's own; an all-zero
# placeholder "00:00:00:00:00:00" is accepted.
poll_mac_prefix = "MAC#"
poll_payload = "POLL:)"
poll_placeholder_mac = "00:00:00:00:00:00"
# TagStream encoding: an optional 4-byte ASCII header, then length-prefixed
# fields [len][content], len inclusive of the length byte, terminated by 0x00.
# Reply fields are themselves [4-char key][value]; known reply keys:
reply_keys = [
  { key = "NAME", meaning = "device display name" },
  { key = "SWVS", meaning = "software build number" },
  { key = "VSTR", meaning = "full version string" },
  { key = "MAC#", meaning = "device MAC, no separators" },
  { key = "OWNR", meaning = "owner name" },
  { key = "APPR", meaning = "appliance / product class" },
  { key = "TYPE", meaning = "product / model type id" },
  { key = "SER#", meaning = "serial number" },
  { key = "MGR#", meaning = "manager / session GUID" },
  { key = "DEF#", meaning = "device-definition (DDF) GUID" },
  { key = "MGR2", meaning = "secondary manager GUID" },
  { key = "FSET", meaning = "feature-set token" },
  { key = "LICN", meaning = "license level" },
  { key = "SYNL", meaning = "sync-layer available flag" },
]

[handshake]
# On TCP connect the device sends first: a list of supported protocol GUIDs,
# one per CRLF line, ending with a line containing only ".". The client writes
# "<GUID>\r\n"; the device replies "+<GUID>\r\n" (accept) or "-NO\r\n" (reject).
terminator = "\r\n"
list_end_marker = "."
accept_prefix = "+"
reject_prefix = "-"
# After acceptance of the streaming protocol the client writes 8 zero bytes to
# open the session, then the framed stream begins.
session_preamble_len = 8

[protocols]
# The protocol GUIDs the device offers. libkp speaks two of them — the MIDI3
# stream and the CBOR control channel, as the model's two links (docs/11); the
# other two are named and never opened.
midi3_stream    = "{369F50E7-750B-459A-BAEE-85ADD3F3798D}"  # bidirectional MIDI3: meters + request/reply/control
request_response = "{2490272E-CD92-4DBA-AE32-E8AF37ED3B0A}" # accepts; sends an 11-byte token on open
cbor_control    = "{774CDB9E-74ED-4740-AF09-AC96B3A69A11}"  # native CBOR (Protocol3): the state-dump snapshot route
reserved        = "{77DB6B28-785E-4641-B840-42F0F06A11FC}"  # offered but rejects the handshake (-NO)

[cbor]
# The native control channel (protocol GUID `cbor_control`) completes the same
# handshake and 8-byte preamble as the MIDI3 stream, then carries a continuous
# sequence of bare CBOR items (RFC 8949) with no outer framing — the CBOR
# self-description supplies the boundaries. Every item is `tag(1)` wrapping a
# small integer array whose first element (after an optional leading negative
# source-flag word) selects the shape. See docs/06.
item_tag = 1
selector_single = 1     # tag(1)([1, addr, value])            — one parameter
selector_multi = 2      # tag(1)([2, base, v0, v1, ...])      — a consecutive run from base
selector_string = 4     # tag(1)([4, addr, "text"])           — a string parameter
# Inter-item padding: bare 0xC0 (a tag(0) head with no content, not well-formed
# on its own) appears in runs between top-level items and must be skipped —
# except when the next head opens a text string, which marks a genuine tag(0)
# datetime rather than filler.
filler_byte = 0xC0
# The device does NOT volunteer its full parameter state on connect; a passive
# session sees only live change events. Writing this single item asks for it:
# the device answers with the whole state as a burst of `selector_multi` and
# `selector_string` items. The write is non-mutating (it sets a status flag the
# device already carries) and applies to address 102528 = 1.
state_dump_trigger_address = 102528
state_dump_trigger_value = 1
# The item that always ends a state dump: a consecutive run whose base is this
# address. Measured over repeated dumps (docs/11); the model closes the dump
# phase when it has folded that run, and falls back to `dump_settle_ms`.
dump_end_address = 100800
# The dump has two sections, each closed by that run: the system section
# (identity, global settings, the position) and then the rig section, which
# opens with the position run again. Measured identical across repeated
# dumps: the run sits at item 32 (~80 ms) and at item 201 (~340 ms) of 202.
# The phase ends at the second, and `dump_settle_ms` covers a device that
# never sends it.
dump_end_runs = 2
# Addresses whose string values are the device's stored WiFi credentials
# (network name and passphrase). The state dump volunteers both in the clear; a
# reader must never surface them. See docs/06.
sensitive_addresses = [200008, 200009]
redacted_placeholder = "[redacted]"

[midi3]
# The streaming protocol carries MIDI as 4-byte frames [tag][b0 b1 b2].
# 0x14 = continuation (3 valid bytes, more follow); 0x15/0x16/0x17 = final
# group with 1/2/3 valid bytes. Concatenated valid bytes form a raw MIDI
# message (typically a Kemper SysEx F0 00 20 33 ... F7).
tag_continuation = 0x14
tag_final_1 = 0x15
tag_final_2 = 0x16
tag_final_3 = 0x17

[sysex]
# Kemper MIDI manufacturer id and the fixed SysEx header shape:
# F0 <mfr:3> <product> <device> <function> <instance=0> <page> <number> <values..> F7
manufacturer_id = [0x00, 0x20, 0x33]
product_profiler = 0x00     # original Profiler
product_player = 0x02       # Profiler Player class
device_omni = 0x7F
full_scale = 16383          # maximum 14-bit NRPN value

# SysEx function codes (Kemper MIDI Parameter Documentation, Table 5).
[sysex.functions]
single_param = 0x01              # Single Parameter Change (set / $01 reply)
multi_param = 0x02               # Multi Parameter Change (consecutive addrs; $42 reply)
string_param = 0x03              # String Parameter (set / $43 reply)
blob = 0x04                      # binary object
ext_param = 0x06                 # extended param (5-byte address/value)
ext_string_param = 0x07          # extended string (5-byte address)
morphed_multi_param = 0x08       # morphed multi-parameter
rendered_string_reply = 0x3C     # reply to a rendered-string request
request_single = 0x41            # request a single numeric parameter (reply $01)
request_multi = 0x42             # request all params of a unit (reply $02)
request_string = 0x43            # request a string parameter (reply $03)
request_ext_param = 0x46         # request an extended-address parameter (reply $06)
request_ext_string = 0x47        # request an extended string
request_rendered_string = 0x7C   # request a value rendered to display text (reply $3C)
beacon = 0x7E                    # bidirectional beacon (PySwitch; undocumented in the PDF)

[beacon]
# The bidirectional beacon asks the device to stream a selected parameter set
# and send a "sense" status roughly every 500 ms; it must be re-sent within the
# lease. Layout: F0 <mfr> <product> 7F 7E 00 40 <param_set> <flags> <lease/2> F7.
# Credited to PySwitch.
function = 0x7E
subcommand = 0x40
default_param_set = 0x02
# Flag bits: 0 init, 1 sysex, 2 echo, 3 nofe, 4 noctr, 5 tunemode.
flag_init = 0x01
flag_sysex = 0x02
flag_tunemode = 0x20
