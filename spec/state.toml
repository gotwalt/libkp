# ---------------------------------------------------------------------------
# Page 0 numerics: the morph. The button is a momentary the device reports on
# press and release; the position is the fader it drives, which only the CBOR
# channel carries (parameters.toml, `[well_known]`).
# ---------------------------------------------------------------------------

[[route]]
name = "morph_button"
page = "page_morph"
number = "morph_button_number"
kind = "bool"
lane = "fast"
event = "morph_button"
wire = "stream"
dedupe = false
request = false

[[route]]
name = "morph_position"
page = "page_morph"
number = "morph_number"
kind = "u14"
lane = "slow"
event = "morph_changed"
wire = "control"
dedupe = true
request = false

