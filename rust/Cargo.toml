[package]
name = "libkp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Kemper Profiler network protocol: discovery, session, MIDI3/SysEx, control, and an observable device model."
license = "MIT"
repository = "https://github.com/gotwalt/libkp"
keywords = ["kemper", "midi", "profiler", "protocol"]
categories = ["network-programming", "multimedia::audio"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "signal"] }
thiserror = "2"
socket2 = "0.6"
if-addrs = "0.15"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"

[[example]]
name = "meters"
path = "examples/meters.rs"
